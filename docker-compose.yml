# Local environment. Passwords below are development-only defaults; override them through a .env file.
# Postgres and the legacy instances always run; `docker compose --profile phase2 up` adds Keycloak, the gateway and the
# SPA (the current state). Earlier phases are reproduced by checking out their `phase-N` tag.
name: agenda-saas

x-legacy-common: &legacy-common
  build:
    context: .
    dockerfile: legacy-monolith/Dockerfile
  image: agenda/legacy-monolith:dev
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy
      required: false

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      LEGACY_ACME_DB_PASSWORD: ${LEGACY_ACME_DB_PASSWORD:-legacy_acme_dev}
      LEGACY_BELLA_DB_PASSWORD: ${LEGACY_BELLA_DB_PASSWORD:-legacy_bella_dev}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    profiles: ["phase2"]
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
      # Substituted into identity/realm-export.json at import time.
      BACKOFFICE_ACME_CLIENT_SECRET: ${BACKOFFICE_ACME_CLIENT_SECRET:-dev-backoffice-acme-secret}
      BACKOFFICE_BELLA_CLIENT_SECRET: ${BACKOFFICE_BELLA_CLIENT_SECRET:-dev-backoffice-bella-secret}
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8180:8180"
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  legacy-acme:
    <<: *legacy-common
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/legacy_acme
      DB_USERNAME: legacy_acme
      DB_PASSWORD: ${LEGACY_ACME_DB_PASSWORD:-legacy_acme_dev}
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed/acme
      LEGACY_INSTANCE_NAME: Acme Clinic
      LEGACY_CANCELLATION_MIN_HOURS: 24
      LEGACY_TENANT_ID: acme-clinic
      OIDC_ISSUER_URI: http://keycloak.localhost:8180/realms/agenda
      OIDC_CLIENT_ID: backoffice-acme
      OIDC_CLIENT_SECRET: ${BACKOFFICE_ACME_CLIENT_SECRET:-dev-backoffice-acme-secret}
      # Both instances share the localhost cookie jar (cookies ignore ports), so session cookies need distinct names.
      SESSION_COOKIE_NAME: ACME_SESSION
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:8081:8080"

  legacy-bella:
    <<: *legacy-common
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/legacy_bella
      DB_USERNAME: legacy_bella
      DB_PASSWORD: ${LEGACY_BELLA_DB_PASSWORD:-legacy_bella_dev}
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed/bella
      LEGACY_INSTANCE_NAME: Bella Salon
      LEGACY_CANCELLATION_MIN_HOURS: 12
      LEGACY_TENANT_ID: bella-salon
      OIDC_ISSUER_URI: http://keycloak.localhost:8180/realms/agenda
      OIDC_CLIENT_ID: backoffice-bella
      OIDC_CLIENT_SECRET: ${BACKOFFICE_BELLA_CLIENT_SECRET:-dev-backoffice-bella-secret}
      SESSION_COOKIE_NAME: BELLA_SESSION
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:8082:8080"

  # Single entry point. API calls take the tenant from the access token; browser requests from <tenant>.localhost:8080.
  gateway:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: agenda/gateway:dev
    restart: unless-stopped
    depends_on:
      legacy-acme:
        condition: service_started
      legacy-bella:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      LEGACY_ACME_URI: http://legacy-acme:8080
      LEGACY_BELLA_URI: http://legacy-bella:8080
      OIDC_ISSUER_URI: http://keycloak.localhost:8180/realms/agenda
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:8080:8080"

  # React SPA served by unprivileged nginx, which proxies /api to the gateway (same origin, no CORS).
  web:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: web/Dockerfile
    image: agenda/web:dev
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:3000:8080"

volumes:
  pgdata:
