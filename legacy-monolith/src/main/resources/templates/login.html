<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="login">
<main>
    <h1 th:text="${instanceName}">Instance</h1>
    <p class="flash error" th:if="${param.error}">
        This account cannot sign in to <span th:text="${instanceName}">this instance</span>.
        Sign out of the platform and sign in with an account of this clinic.
    </p>
    <p class="flash ok" th:if="${param.logout}">You have been signed out.</p>
    <p><a class="button" th:href="@{/oauth2/authorization/keycloak}">Sign in with Agenda SSO</a></p>
</main>
</body>
</html>
