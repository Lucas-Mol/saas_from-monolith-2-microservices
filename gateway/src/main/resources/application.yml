spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

tenancy:
  base-domain: ${TENANCY_BASE_DOMAIN:localhost}

# Strangler Fig migration table. A tenant moves to a new service by adding it to a route's migratedTenants;
# rollback is removing it. Phase 1: nothing migrated yet, every tenant stays on its legacy instance.
#   routes:
#     - path: /api/appointments/**
#       target: http://scheduling-service:8080
#       migratedTenants: [acme-clinic]
migration:
  tenants:
    acme-clinic:
      legacy-uri: ${LEGACY_ACME_URI:http://legacy-acme:8080}
    bella-salon:
      legacy-uri: ${LEGACY_BELLA_URI:http://legacy-bella:8080}
